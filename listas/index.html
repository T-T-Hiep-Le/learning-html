<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Ejemplo de lista ordenada</h1>
    <ol>
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
    </ol>
    <h1>Ejemplo de lista desordenada</h1>
    <ul>
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
    </ul>
    <h1>Ejemplo de lista anidada</h1>
    <ul>
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3
            <ul>
                <li>Elemento 3.1</li>
                <li>Elemento 3.2</li>
                <li>Elemento 3.3</li>
            </ul>
        </li>
    </ul>
</body>
</html>
